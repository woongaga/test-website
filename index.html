<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4e0">
<title>절대 누르지 마시오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff4e0;--ink:#2b2118;--red:#e63b2e;--red-d:#a8231a;--card:#fff;--muted:#8a7a68;--dot:#ecdcbf;--blue:#2f6fed}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow-x:hidden;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:22px 22px;
  }
  button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 4px;font-size:13px}
  .chip{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;text-align:center;font-size:clamp(36px,11vw,58px);margin:10px 16px 0;letter-spacing:-1px;line-height:1.05}
  h1 small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:6px}
  #msg{min-height:3.2em;text-align:center;font-size:clamp(17px,4.8vw,21px);padding:14px 20px 0;font-weight:700;max-width:520px;margin:0 auto;line-height:1.45;word-break:keep-all}
  .pop{animation:pop .35s}
  @keyframes pop{0%{transform:scale(.92);opacity:.3}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 12px}
  #stage{position:relative;width:100%;max-width:440px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:6px 16px calc(14px + env(safe-area-inset-bottom))}
  footer b{color:var(--ink)}

  /* 빨간 버튼 */
  .big{
    --s:1;width:200px;height:200px;border-radius:50%;border:none;padding:16px;
    background:radial-gradient(circle at 35% 30%,#ff7a6b,var(--red) 55%,var(--red-d));
    box-shadow:0 12px 0 #7d150f,0 18px 26px rgba(0,0,0,.25),inset 0 -6px 12px rgba(0,0,0,.2);
    color:#fff;font-family:'Black Han Sans',sans-serif;font-size:28px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.25);
    transform:scale(var(--s));transition:transform .25s,box-shadow .08s,translate .08s;
  }
  .big:active{translate:0 10px;box-shadow:0 2px 0 #7d150f,0 4px 8px rgba(0,0,0,.25),inset 0 -6px 12px rgba(0,0,0,.2)}
  .big:disabled{cursor:default}
  #stage.field{display:block;height:380px;min-height:0}
  #stage.field .big{position:absolute;width:118px;height:118px;font-size:19px;padding:8px;transition:left .18s,top .18s,box-shadow .08s,translate .08s}

  /* 공통 UI */
  .card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px;width:100%}
  .btn{font-size:17px;font-weight:700;padding:12px 18px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);transition:translate .06s,box-shadow .06s}
  .btn:active{translate:3px 3px;box-shadow:0 0 0 var(--ink)}
  .btn.primary{background:var(--red);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px;justify-content:center;width:100%}
  .row .btn{flex:1}
  .head{text-align:center;font-size:18px;margin-bottom:14px;line-height:1.4}
  .sub{color:var(--muted);font-size:14px;text-align:center;min-height:1.4em}

  /* 로딩 */
  .load{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .bar{width:100%;height:28px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
  .fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#ff7a6b 12px 24px);transition:width .12s linear}
  .pct{font-family:'Black Han Sans',sans-serif;font-size:44px;font-variant-numeric:tabular-nums}

  /* 캡차 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
  .tile{aspect-ratio:1;border:3px solid transparent;border-radius:8px;background:#efe8da;position:relative;padding:0;transition:transform .1s}
  .tile.on{border-color:var(--blue);transform:scale(.9)}
  .tile.on::after{content:'✓';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;line-height:22px}

  /* 약관 */
  .terms{max-height:190px;overflow:auto;font-size:14px;line-height:1.7;background:#faf6ee;padding:12px 14px;border-radius:10px;border:1.5px solid #e2d6c0;-webkit-overflow-scrolling:touch}
  .terms p{margin:0 0 10px}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:14px 0;line-height:1.4}
  .chk input{accent-color:var(--red);width:20px;height:20px;flex:none;margin:0}

  /* 분신술 */
  .clones{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:340px}
  .clone{aspect-ratio:1;border:none;border-radius:50%;padding:0;font-size:13px;font-weight:700;color:#fff;
    background:radial-gradient(circle at 35% 30%,#ff7a6b,var(--red) 55%,var(--red-d));box-shadow:0 5px 0 #7d150f;transition:transform .2s,opacity .2s}
  .clone:active{transform:translateY(4px)}
  .clone.gone{opacity:.3;transform:scale(.8);background:#9b8f80;box-shadow:none}
  .clone.real{background:radial-gradient(circle at 35% 30%,#fff3a6,#ffc400 60%,#c98f00);color:var(--ink);transform:scale(1.15)}

  /* 꾹 누르기 */
  .ring{--p:0;padding:12px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p) * 1%),var(--dot) 0)}
  .ring .big{display:block;touch-action:none}

  /* 인증서 */
  .cert{background:#fffdf6;border:5px double var(--ink);border-radius:6px;padding:22px 18px 18px;text-align:center;width:100%;box-shadow:5px 5px 0 var(--ink);line-height:1.6;position:relative}
  .cert-t{font-family:'Black Han Sans',sans-serif;font-size:32px;letter-spacing:2px}
  .cert-no{font-size:12px;color:var(--muted);margin-bottom:10px}
  .cert p{font-size:15px;margin:12px 0;word-break:keep-all}
  .name{border:none;border-bottom:2px dashed var(--ink);background:transparent;font:inherit;font-size:20px;font-weight:700;text-align:center;width:80%;padding:4px;user-select:text;-webkit-user-select:text;outline:none;color:var(--ink)}
  .grade{margin:8px 0 4px;font-size:15px}
  .grade span{display:block;font-family:'Black Han Sans',sans-serif;font-size:46px;color:var(--red);line-height:1.1}
  .cert-f{font-size:13px;margin-top:12px;color:var(--muted)}
  .stamp{position:absolute;right:14px;bottom:12px;width:62px;height:62px;border:3px solid var(--red);border-radius:50%;color:var(--red);
    font-family:'Black Han Sans',sans-serif;font-size:16px;line-height:1.05;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);opacity:.85}

  .cf{position:fixed;top:-40px;pointer-events:none;font-size:26px;animation:fall linear forwards;z-index:9}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
</style>
</head>
<body>
  <header>
    <span class="chip">🚫 무쓸모 연구소</span>
    <span class="chip">⏳ 낭비한 시간 <b id="timer">00:00</b></span>
  </header>
  <h1>절대 누르지 마시오<small>이 웹사이트는 아무 기능이 없습니다</small></h1>
  <div id="msg"></div>
  <main><div id="stage"></div></main>
  <footer>누른 횟수 <b id="count">0</b>회 · LV <b id="lv">1</b> / 9</footer>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), msg = $('#msg');
let t0 = Date.now(), presses = 0, step = -1;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));

let ac;
function beep(f = rand(260, 520), d = .07, type = 'square') {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function tap() {
  presses++; $('#count').textContent = presses; beep();
  try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
}
function say(html) {
  msg.innerHTML = html;
  msg.classList.remove('pop'); void msg.offsetWidth; msg.classList.add('pop');
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const fmt = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmtKo = s => (s >= 60 ? Math.floor(s / 60) + '분 ' : '') + (s % 60) + '초';
setInterval(() => { $('#timer').textContent = fmt(Date.now() - t0); }, 250);
stage.addEventListener('contextmenu', e => e.preventDefault());

function next() {
  step++;
  stage.innerHTML = ''; stage.className = '';
  $('#lv').textContent = step + 1;
  STEPS[step]();
}

// LV1: 누르지 말라니까
function intro() {
  say('이 버튼은 아무 기능이 없습니다.<br>그러니 누르지 마세요.');
  const b = el('button', 'big', '누르지<br>마시오');
  stage.append(b);
  const lines = ['...방금 누르셨네요?', '누르지 말라고 했는데요.', '한 번만 더 누르면 진짜 서운할 거예요.', '서운합니다. 😢', '버튼도 아프대요. "아야"', '좋아요. 작전을 바꾸죠.'];
  let i = 0;
  b.onclick = () => {
    tap(); say(lines[i]);
    b.style.setProperty('--s', (1 - (i + 1) * .07).toFixed(2));
    if (i === 3) b.innerHTML = '😢';
    if (i === 4) b.innerHTML = '아야';
    if (++i === lines.length) { b.disabled = true; setTimeout(next, 1300); }
  };
}

// LV2: 도망가는 버튼
function runaway() {
  say('잡을 수 있으면 눌러보세요 😜');
  stage.className = 'field';
  const b = el('button', 'big', '누르지<br>마시오');
  stage.append(b);
  const taunts = ['느려요~', '어림없죠 ㅋ', '거의 잡을 뻔?', '손가락 운동 중이세요?', '오 좀 하시네', '헉... 헉... 더는 못 뛰겠어요'];
  let n = 0;
  const place = center => {
    const W = stage.clientWidth - b.offsetWidth, H = stage.clientHeight - b.offsetHeight;
    b.style.left = (center ? W / 2 : rand(0, W)) + 'px';
    b.style.top = (center ? H / 2 : rand(0, H)) + 'px';
  };
  place(true);
  const flee = () => {
    say(taunts[n++]); place(); beep(rand(600, 900), .05, 'triangle');
    if (n === taunts.length) b.innerHTML = '헉헉..';
  };
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && n < taunts.length) flee(); });
  b.onclick = () => {
    tap();
    if (n < taunts.length) return flee();
    b.onclick = null; b.innerHTML = '😵';
    say('잡혔다... 체력이 다 됐대요.');
    setTimeout(next, 1200);
  };
}

// LV3: 영원히 끝나지 않는 로딩
async function loading() {
  say('버튼 기능을 불러오는 중입니다...');
  const w = el('div', 'load', '<div class="pct">0%</div><div class="bar"><div class="fill"></div></div><div class="sub"></div>');
  const fast = el('button', 'btn', '⏩ 빨리 감기');
  stage.append(w, fast);
  const fill = w.querySelector('.fill'), pct = w.querySelector('.pct'), sub = w.querySelector('.sub');
  const set = p => { fill.style.width = p + '%'; pct.textContent = Math.floor(p) + '%'; };
  const subs = ['쓸모 다운로드 중...', '의미 압축 해제 중...', '재미 설치 중...', '거의 다 됐어요...'];
  let slow = 1;
  fast.onclick = () => {
    tap(); slow = Math.min(slow * 1.4, 4);
    say(pick(['누를수록 느려집니다.', '더 느려졌습니다.', '그거 빨리 감기 아니에요.', '인내심 테스트 중입니다.']));
  };
  for (let p = 0; p < 99; p += rand(1, 4)) {
    set(p); sub.textContent = subs[Math.min(3, Math.floor(p / 25))];
    await wait(rand(40, 130) * slow);
  }
  set(99); fast.remove();
  await wait(1600);
  say('어...?');
  for (let p = 99; p >= 12; p -= 3) { set(p); await wait(30); }
  await wait(500);
  say('기능을 찾지 못했습니다.<br>원래 없었습니다.');
  sub.textContent = '오류 404: 쓸모 Not Found';
  const ok = el('button', 'btn primary', '확인 (이것도 쓸모없음)');
  stage.append(ok);
  ok.onclick = () => { tap(); ok.disabled = true; next(); };
}

// LV4: 캡차
function captcha() {
  say('잠깐, 로봇이 아닌지 확인할게요.');
  const c = el('div', 'card', '<div class="head"><b>아무것도 없는 칸</b>을<br>모두 선택하세요</div><div class="grid"></div><button class="btn primary" style="width:100%">확인</button>');
  stage.append(c);
  const g = c.querySelector('.grid'), ok = c.querySelector('.btn');
  for (let i = 0; i < 9; i++) {
    const t = el('button', 'tile');
    t.setAttribute('aria-label', '빈 칸');
    t.onclick = () => { tap(); t.classList.toggle('on'); };
    g.append(t);
  }
  ok.onclick = () => {
    tap();
    const k = g.querySelectorAll('.on').length;
    if (k === 9) { ok.disabled = true; say('완벽합니다.<br>확실히 시간이 남아도는 인간이시군요.'); setTimeout(next, 1500); }
    else if (k === 0) say('하나도 안 고르셨네요?<br>다 비어있는데요.');
    else say(`아직 아무것도 없는 칸이 ${9 - k}개 남았어요.`);
  };
}

// LV5: 약관 동의
const TERMS = [
  '<b>제1조 (목적)</b> 본 약관은 아무 목적이 없음을 목적으로 합니다.',
  '<b>제2조 (정의)</b> "버튼"이란 누르지 말라고 했는데 굳이 누르는 그것을 말합니다.',
  '<b>제3조 (이용자의 의무)</b> 이용자는 본 사이트에서 낭비한 시간을 누구에게도 청구할 수 없습니다.',
  '<b>제4조 (개인정보)</b> 당사는 어떠한 개인정보도 수집하지 않습니다. 관심이 없기 때문입니다.',
  '<b>제5조 (환불)</b> 시간은 환불되지 않습니다.',
  '<b>제6조 (면책)</b> 본 사이트 이용 중 발생한 현타에 대해 당사는 책임지지 않습니다.',
  '<b>제7조 (칭찬)</b> 여기까지 읽으셨다면 정말 대단하십니다.',
  '<b>제8조 (고백)</b> 사실 약관은 아무도 안 읽습니다. 저희도 안 읽었습니다.',
  '<b>제9조 (효력)</b> 본 약관은 당신이 이 문장을 읽는 순간 효력이 발생합니다. 방금 발생했습니다.',
  '<b>부칙</b> 끝. 수고하셨습니다. 🎉'
].map(t => `<p>${t}</p>`).join('');
function terms() {
  say('계속하려면 약관에 동의해주세요.<br><small>(끝까지 읽어야 체크됩니다)</small>');
  const c = el('div', 'card', `<div class="terms">${TERMS}</div>
    <label class="chk"><input type="checkbox" disabled><span>약관을 끝까지 읽었으며, 이 웹사이트가 쓸모없다는 것에 동의합니다.</span></label>
    <div class="row"><button class="btn">동의 안 함</button><button class="btn primary" disabled>동의</button></div>`);
  stage.append(c);
  const box = c.querySelector('.terms'), chk = c.querySelector('input'), [no, yes] = c.querySelectorAll('.btn');
  let noCount = 0;
  box.addEventListener('scroll', () => {
    if (chk.disabled && box.scrollTop + box.clientHeight >= box.scrollHeight - 8) {
      chk.disabled = false; say('끝까지 읽으셨군요. 존경합니다.');
    }
  });
  chk.onchange = () => { tap(); yes.disabled = !chk.checked; };
  const agree = () => { tap(); no.disabled = yes.disabled = true; say('동의해주셔서 감사합니다.<br>아무 일도 일어나지 않습니다.'); setTimeout(next, 1500); };
  yes.onclick = agree;
  no.onclick = () => {
    if (noCount++ === 0) { tap(); no.textContent = '동의'; no.classList.add('primary'); say('그런 선택지는 준비되지 않았습니다.'); }
    else agree();
  };
}

// LV6: 분신술
function clones() {
  say('버튼이 분신술을 썼습니다!<br>진짜를 찾아 누르세요.');
  const g = el('div', 'clones');
  const real = Math.floor(Math.random() * 16);
  const fakes = ['가짜', '꽝', '아님', 'ㅋ', '노노', '땡', '🙅', '분신'];
  for (let i = 0; i < 16; i++) {
    const b = el('button', 'clone');
    b.onclick = () => {
      tap();
      if (i === real) {
        b.textContent = '진짜!'; b.classList.add('real');
        g.querySelectorAll('button').forEach(x => x.disabled = true);
        say('찾았다! ...근데 찾아서 뭐하죠?');
        setTimeout(next, 1400);
      } else {
        b.textContent = pick(fakes); b.classList.add('gone'); b.disabled = true;
        say(pick(['그건 가짜예요.', '땡!', '진짜는 따로 있어요.', '아깝다! (사실 안 아까움)', '분신이었습니다.']));
      }
    };
    g.append(b);
  }
  stage.append(g);
}

// LV7: 꾹 누르기
function hold() {
  say('이번엔 <b>꾹</b> 누르고 계세요.<br>손 떼면 처음부터!');
  const ring = el('div', 'ring'), b = el('button', 'big', '꾹');
  ring.append(b); stage.append(ring);
  const DUR = 5000;
  let p = 0, last = 0, raf = 0, slipped = false, done = false, holding = false;
  const draw = () => { ring.style.setProperty('--p', p); b.textContent = Math.floor(p) + '%'; };
  const loop = t => {
    p += (t - last) / DUR * 100; last = t;
    if (!slipped && p >= 93) { slipped = true; p = 50; say('앗, 미끄러졌다!<br>계속 누르세요!'); beep(140, .25, 'sawtooth'); }
    else if (p > 30 && p < 31) say('팔 아프시죠?');
    if (p >= 100) {
      p = 100; done = true; holding = false; draw(); b.textContent = '끝';
      say('축하합니다.<br>인생의 몇 초를 또 버리셨습니다.');
      setTimeout(next, 1400);
      return;
    }
    draw(); raf = requestAnimationFrame(loop);
  };
  b.addEventListener('pointerdown', e => {
    if (done || holding) return;
    holding = true; tap();
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    say('좋아요... 계속...');
    last = performance.now(); raf = requestAnimationFrame(loop);
  });
  const release = () => {
    if (done || !holding) return;
    holding = false; cancelAnimationFrame(raf);
    say(pick(['손 떼셨네요. 처음부터!', '아깝네요~ 다시!', '인내심이 부족하시군요.']));
    p = 0; draw(); b.textContent = '꾹';
  };
  b.addEventListener('pointerup', release);
  b.addEventListener('pointercancel', release);
}

// LV8: 마지막 질문
function lastQ() {
  say('마지막 질문입니다.');
  const c = el('div', 'card', '<div class="head">정말로 이 쓸모없는 버튼을<br><b>끝까지</b> 누르시겠습니까?</div><div class="row"><button class="btn primary">예</button><button class="btn">아니오</button></div>');
  stage.append(c);
  const row = c.querySelector('.row'), [yes, no] = c.querySelectorAll('.btn');
  let dodge = 0;
  no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && dodge++ < 3) row.append(row.firstElementChild); });
  const end = text => { tap(); yes.disabled = no.disabled = true; say(text); setTimeout(next, 1600); };
  yes.onclick = () => end('역시. 그럴 줄 알았어요.');
  no.onclick = () => end('"아니오"를 누르셨으므로<br>"예"로 간주합니다.');
}

// LV9: 쓸모없음 인증서
function certificate() {
  const sec = Math.floor((Date.now() - t0) / 1000);
  const [rank, title] = sec < 60 ? ['C급', '손이 너무 빠른 효율충']
    : sec < 120 ? ['B급', '적당히 한가한 사람']
    : sec < 240 ? ['A급', '숙련된 시간 낭비가']
    : ['S급', '전설의 잉여인간'];
  const d = new Date();
  say('축하합니다! 🎉<br>당신은 아무것도 얻지 못했습니다.');
  const c = el('div', 'cert', `
    <div class="cert-t">쓸모없음 인증서</div>
    <div class="cert-no">제 ${String(Math.floor(rand(1, 99999))).padStart(5, '0')} 호</div>
    <input class="name" maxlength="12" placeholder="이름 입력 (선택)">
    <p>위 사람은 아무 기능 없는 버튼을 <b>${presses}번</b> 누르며 인생의 <b>${fmtKo(sec)}</b>를 성실히 낭비하였기에 이 증서를 수여합니다.</p>
    <div class="grade"><span>${rank}</span>${title}</div>
    <div class="cert-f">${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일<br>쓸모없는 웹사이트 위원회</div>
    <div class="stamp">무쓸<br>인증</div>`);
  const row = el('div', 'row', '<button class="btn primary">📣 자랑하기</button><button class="btn">🔁 또 낭비하기</button>');
  stage.append(c, row);
  const [share, again] = row.querySelectorAll('.btn');
  const text = `나는 아무 기능 없는 버튼을 ${presses}번 누르고 ${fmtKo(sec)}를 낭비했다. 등급: ${rank} ${title}`;
  share.onclick = async () => {
    tap();
    try {
      if (navigator.share) await navigator.share({ title: '절대 누르지 마시오', text, url: location.href });
      else { await navigator.clipboard.writeText(text + '\n' + location.href); say('복사됐어요!<br>친구의 시간도 낭비시켜 주세요.'); }
    } catch (e) {}
  };
  again.onclick = () => {
    t0 = Date.now(); presses = 0; step = -1;
    $('#count').textContent = 0;
    next();
  };
  confetti();
}
function confetti() {
  const em = ['🎉', '🗑️', '⏳', '🔴', '🙃', '✨'];
  for (let i = 0; i < 36; i++) {
    const s = el('span', 'cf', pick(em));
    s.style.left = rand(0, 100) + 'vw';
    s.style.animationDuration = rand(2.2, 4.2) + 's';
    s.style.animationDelay = rand(0, .8) + 's';
    document.body.append(s);
    setTimeout(() => s.remove(), 5200);
  }
}

const STEPS = [intro, runaway, loading, captcha, terms, clones, hold, lastQ, certificate];
next();
